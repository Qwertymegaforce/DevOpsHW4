{{- if .Values.postgres.enabled }}
{{- $fullname := include "counter.fullname" . }}
{{- $secretName := printf "%s-postgres-auth" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $owned := false }}
{{- if $existing }}
{{- $ann := $existing.metadata.annotations | default dict }}
{{- if eq (index $ann "meta.helm.sh/release-name" | default "") .Release.Name }}{{ $owned = true }}{{ end }}
{{- end }}
{{- if or (not $existing) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.user | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  {{- if $existing }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-postgres-init
  labels:
    {{- include "counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS counter (
      id    integer PRIMARY KEY CHECK (id = 1),
      value bigint  NOT NULL DEFAULT 0
    );
    INSERT INTO counter (id, value) VALUES (1, 0) ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "counter.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "counter.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "counter.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: {{ $fullname }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
