{{- $host := include "counter.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "counter.fullname" . }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ include "counter.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "counter.fullname" . }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "counter.fullname" . }}-frontend
                port:
                  name: http
