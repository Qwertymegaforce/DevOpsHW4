apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: counter
data:
  HOST: "0.0.0.0"
  PORT: "9090"
  PYTHONUNBUFFERED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: counter
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: counter
  annotations:
    kubernetes.io/change-cause: "initial release counter-backend:1.0.0, PORT=9090"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 60
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: counter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: counter-backend:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /api/counter
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/counter
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/counter
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: counter
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
