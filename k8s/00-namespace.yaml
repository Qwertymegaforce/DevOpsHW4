apiVersion: v1
kind: Namespace
metadata:
  name: counter
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: counter
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        memory: 512Mi
