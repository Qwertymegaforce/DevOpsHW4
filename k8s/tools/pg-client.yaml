apiVersion: v1
kind: Pod
metadata:
  name: pg-client
  namespace: counter
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:16-alpine
      command: ["sleep", "3600"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_USER
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_DB
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
